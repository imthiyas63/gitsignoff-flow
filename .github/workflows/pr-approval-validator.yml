name: PR Approval Validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  validate-approvals:
    name: Check PR Approvals
    runs-on: ubuntu-latest
    steps:
      - name: Validate Approvals
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            async function run() {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const prNumber = context.payload.pull_request.number;
              const sha = context.payload.pull_request.head.sha;

              core.info(`🔍 Checking approvals for PR #${prNumber}...`);

              // 1. Get all reviews
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: prNumber, per_page: 100
              });

              core.info(` Found ${reviews.length} reviews`);

              // 2. Get latest review per user
              const latestReviews = new Map();
              for (const review of reviews.sort((a, b) => 
                new Date(a.submitted_at) - new Date(b.submitted_at))) {
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                  latestReviews.set(review.user.login, {
                    state: review.state,
                    user: review.user
                  });
                }
              }

              // 3. Check permissions for each approver
              let authorizedApprovals = 0;
              let unauthorizedApprovals = 0;
              let changesRequested = 0;

              core.info('\n🔍 Checking reviewer permissions:');
              for (const [userLogin, reviewData] of latestReviews.entries()) {
                if (reviewData.state === 'CHANGES_REQUESTED') {
                  core.info(`❌ ${userLogin} requested changes`);
                  changesRequested++;
                  continue;
                }
                
                if (reviewData.state === 'APPROVED') {
                  try {
                    const { data: permission } = await github.rest.repos.getCollaboratorPermission({
                      owner, repo, username: userLogin
                    });
                    
                    const userPerm = permission.permission;
                    const hasWriteAccess = ['write', 'admin'].includes(userPerm);
                    
                    if (hasWriteAccess) {
                      core.info(`✅ ${userLogin} (${userPerm}) - AUTHORIZED`);
                      authorizedApprovals++;
                    } else {
                      core.info(`⚠️ ${userLogin} (${userPerm}) - Not authorized (needs write access)`);
                      unauthorizedApprovals++;
                    }
                  } catch (error) {
                    if (error.status === 404) {
                      core.info(`⚠️ ${userLogin} - Not a collaborator`);
                      unauthorizedApprovals++;
                    } else {
                      core.warning(`️ Error checking ${userLogin}: ${error.message}`);
                    }
                  }
                }
              }

              // 4. Determine status
              const hasChanges = changesRequested > 0;
              const hasApproval = authorizedApprovals > 0;
              
              let state, description;
              
              if (hasChanges) {
                state = 'failure';
                description = `${changesRequested} reviewer(s) requested changes`;
              } else if (hasApproval) {
                state = 'success';
                description = `${authorizedApprovals} authorized approval(s) ✅`;
              } else {
                state = 'pending';
                description = 'Waiting for authorized approvals';
              }

              // 5. Set commit status
              await github.rest.repos.createCommitStatus({
                owner, repo, sha,
                state,
                context: 'PR Approval Validator',
                description
              });

              core.info(`\n📊 Status: ${state.toUpperCase()}`);
              core.info(`✅ Authorized: ${authorizedApprovals}`);
              core.info(`⚠️ Unauthorized: ${unauthorizedApprovals}`);
              if (hasChanges) {
                core.info(`❌ Changes requested: ${changesRequested}`);
              }
            }

            run().catch(core.setFailed);