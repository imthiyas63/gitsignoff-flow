name: PR Sign-off Gatekeeper

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: Process Sign-offs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const actor = context.actor;

            console.log(`Processing PR #${prNumber} edited by @${actor}`);

            const roles = ["Code Review", "QA Signoff", "Impact Analysis Review"];
            const signoffMarker = "<!-- PR-SIGNOFF-STATUS -->";

            function escapeRegex(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            // 1. Build sign-off data in a SINGLE pass (removed redundant Step 4)
            const signoffData = {};
            for (const role of roles) {
              const regex = new RegExp(`^\\s*-\\s*\\[[xX]\\]\\s*${escapeRegex(role)}\\s*$`, "im");
              if (regex.test(body)) {
                signoffData[role] = actor;
              }
            }
            const checkedCount = Object.keys(signoffData).length;
            console.log(`Checked: ${checkedCount}/${roles.length}`);

            // Helper function to generate table rows (removed duplicate code)
            const generateTableRows = () => {
              return roles.map(role => {
                const signer = signoffData[role];
                return signer 
                  ? `| **${role}** | ✅ Approved | @${signer} |`
                  : `| **${role}** | ⏳ Pending | - |`;
              }).join("\n");
            };

            const tableRows = generateTableRows();
            const commentBody = `${signoffMarker}

            \`\`\`json
            ${JSON.stringify(signoffData, null, 2)}
            \`\`\`

            ## PR Sign-off Status

            | Role | Status | Signed By |
            |------|--------|-----------|
            ${tableRows}
            `;

            // 2. Get ALL existing PR comments
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });

            // 3. Find ALL existing sign-off comments
            const existingSignoffComments = comments.filter(c => 
              c.body && c.body.includes(signoffMarker)
            );

            console.log(`Found ${existingSignoffComments.length} existing sign-off comments`);

            // 4. UPDATE the first comment, DELETE the rest (prevents notification spam)
            if (existingSignoffComments.length > 0) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existingSignoffComments[0].id, body: commentBody
              });
              console.log(`✅ Updated existing sign-off comment #${existingSignoffComments[0].id}`);
              
              for (let i = 1; i < existingSignoffComments.length; i++) {
                const dup = existingSignoffComments[i];
                await github.rest.issues.deleteComment({ owner, repo, comment_id: dup.id });
                console.log(`🗑️ Deleted duplicate comment #${dup.id}`);
              }
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: commentBody
              });
              console.log("✅ Created new sign-off comment");
            }

            // 5. Find and Update Linked Issues (optimized with matchAll)
            const issueNumbers = new Set();
            
            // Match standard GitHub closing keywords
            for (const match of body.matchAll(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi)) {
              issueNumbers.add(parseInt(match[1], 10));
            }
            
            // Match any other #123 references (excluding the current PR number)
            for (const match of body.matchAll(/#(\d+)/g)) {
              const num = parseInt(match[1], 10);
              if (num !== prNumber) issueNumbers.add(num);
            }

            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ 
                  owner, repo, issue_number: issueNumber 
                });
                
                const issueTableRows = generateTableRows();
                const issueSignoffTable = `${signoffMarker}

            ## PR Sign-off Status

            | Role | Status | Signed By |
            |------|--------|-----------|
            ${issueTableRows}
            ---
            *Automatically synchronized from PR #${prNumber} on ${new Date().toISOString()}*`;
                
                let newIssueBody = issue.body || "";
                
                // Robust string replacement instead of fragile regex
                if (newIssueBody.includes(signoffMarker)) {
                  const markerIndex = newIssueBody.indexOf(signoffMarker);
                  newIssueBody = newIssueBody.substring(0, markerIndex).trim() + "\n\n" + issueSignoffTable;
                } else {
                  newIssueBody = `${newIssueBody.trim()}\n\n${issueSignoffTable}`;
                }
                
                await github.rest.issues.update({ 
                  owner, repo, issue_number: issueNumber, body: newIssueBody 
                });
                console.log(`✅ Updated Issue #${issueNumber}`);
              } catch (error) {
                console.log(`⚠️ Could not update Issue #${issueNumber}: ${error.message}`);
              }
            }

            // 6. Set Commit Status for Branch Protection
            const allSignedOff = roles.every(role => signoffData[role]);
            
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: allSignedOff ? "success" : "pending",
              context: "pr-signoff-gatekeeper",
              description: `${checkedCount}/${roles.length} sign-offs complete`
            });

            console.log(allSignedOff ? "✅ ALL SIGN-OFFS COMPLETE" : `⏳ ${checkedCount}/${roles.length} SIGN-OFFS COMPLETE`);