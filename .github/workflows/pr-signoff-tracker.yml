name: pr-signoff-gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read
  statuses: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: check-signoff-status
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            
            const author = pr.user.login;
            const sender = context.payload.sender.login;
            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];

            // 1. Self-Approval Blocker (Non-intrusive: fails and comments, does not mutate PR body)
            if (author === sender) {
              const warningMessage = `### ⚠️ Self-Approval Blocked\n**@${sender}**, you cannot sign off on your own Pull Request.\n\nPlease ask another team member to review and check the boxes.`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: warningMessage
              });

              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: 'failure',
                context: 'pr-signoff-gatekeeper',
                description: 'Self-approval is not allowed'
              });

              core.setFailed(`PR Author (@${author}) is not allowed to approve their own PR.`);
              return;
            }

            // 2. Validate Checkboxes
            let checkedCount = 0;
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
              }
            }

            // 3. Post Audit Comments (Idempotent check to prevent spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                const alreadyPosted = comments.some(c => c.body.includes(`Sign-off Recorded: ${role}`));
                if (!alreadyPosted) {
                  const timestamp = new Date().toISOString();
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}`
                  });
                }
              }
            }

            // 4. Set Merge Gate Status
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'failure';
            const description = allSignedOff 
              ? `All ${roles.length} sign-offs complete` 
              : `${checkedCount}/${roles.length} sign-offs complete`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'pr-signoff-gatekeeper',
              description: description
            });

            core.info(`Status set to: ${state} (${description})`);