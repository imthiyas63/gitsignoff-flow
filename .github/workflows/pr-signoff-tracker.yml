name: pr-signoff-gatekeeper

on:
  pull_request:
    types: [edited]

permissions:
  pull-requests: write
  contents: read
  statuses: write
  issues: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: Update Project Reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const body = pr.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sender = context.payload.sender.login;
            
            // Get IDs from repository variables
            const projectId = process.env.PROJECT_ID;
            const reviewersFieldId = process.env.REVIEWERS_FIELD_ID;
            
            // Count checked boxes
            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];
            let checkedCount = 0;
            const reviewers = [];
            
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
                reviewers.push(`@${sender}`);
              }
            }
            
            // Update Project field
            if (projectId && reviewersFieldId) {
              const uniqueReviewers = [...new Set(reviewers)];
              const reviewersText = uniqueReviewers.join(', ') || 'Pending';
              
              // Find project item
              const itemQuery = `
                query($projectId: ID!, $prNumber: Int!) {
                  projectV2(projectId: $projectId) {
                    item(contentId: "PR_${prNumber}") {
                      id
                    }
                  }
                }
              `;
              
              const itemResult = await github.graphql(itemQuery, {
                projectId,
                prNumber
              });
              
              const itemId = itemResult.projectV2.item?.id;
              
              if (itemId) {
                // Update the field
                const mutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { text: $value }
                      }
                    ) {
                      clientMutationId
                    }
                  }
                `;
                
                await github.graphql(mutation, {
                  projectId,
                  itemId,
                  fieldId: reviewersFieldId,
                  value: reviewersText
                });
                
                core.info(`✅ Updated Project Reviewers: ${reviewersText}`);
              }
            }
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REVIEWERS_FIELD_ID: ${{ vars.REVIEWERS_FIELD_ID }}