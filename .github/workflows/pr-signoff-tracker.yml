name: PR Sign-off Gatekeeper

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
  projects: write

jobs:
  validate-signoff:
    name: Validate Sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Process Sign-offs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const actor = context.actor;

            console.log(`Processing PR #${prNumber} by @${actor}`);

            const roles = ["Code Review", "QA Signoff", "Impact Analysis Review"];
            const signoffMarker = "<!-- PR-SIGNOFF-STATUS -->";

            function escapeRegex(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            // 1. Extract sign-off data
            const signoffData = {};
            for (const role of roles) {
              const regex = new RegExp(`^\\s*-\\s*\\[[xX]\\]\\s*${escapeRegex(role)}\\s*$`, "im");
              if (regex.test(body)) {
                signoffData[role] = actor;
                console.log(`✅ ${role}: @${actor}`);
              } else {
                console.log(` ${role}: Pending`);
              }
            }
            const checkedCount = Object.keys(signoffData).length;

            // 2. Generate status table
            const tableRows = roles.map(role => {
              const signer = signoffData[role];
              return signer 
                ? `| **${role}** | ✅ Approved | @${signer} |`
                : `| **${role}** | ⏳ Pending | - |`;
            }).join("\n");

            const commentBody = `${signoffMarker}

            \`\`\`json
            ${JSON.stringify(signoffData, null, 2)}
            \`\`\`

            ## PR Sign-off Status

            | Role | Status | Signed By |
            |------|--------|-----------|
            ${tableRows}

            *Last updated: ${new Date().toISOString()}*
            `;

            // 3. Update PR comment
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });

            const existingComment = comments.find(c => c.body && c.body.includes(signoffMarker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existingComment.id, body: commentBody
              });
              console.log(`✅ Updated comment`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: commentBody
              });
              console.log(`✅ Created comment`);
            }

            // 4. Update Project field
            const PROJECT_ID = "PVT_kwHODDf9DM4BjCjd";
            const SIGNOFF_FIELD_ID = "PVTF_lAHODDf9DM4BjCjdzhh4gjY";

            try {
              const projectQuery = `
                query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue { number }
                            ... on PullRequest { number }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const projectData = await github.graphql(projectQuery, { projectId: PROJECT_ID });
              const project = projectData.node;
              
              // Find PR number and any linked issue numbers
              const numbersToFind = new Set([prNumber]);
              const issueRegex = /#(\d+)/g;
              let match;
              while ((match = issueRegex.exec(body)) !== null) {
                numbersToFind.add(parseInt(match[1], 10));
              }

              const itemsToUpdate = project.items.nodes.filter(item => 
                numbersToFind.has(item.content?.number)
              );

              if (itemsToUpdate.length > 0) {
                const statusText = roles.map(role => {
                  const signer = signoffData[role];
                  return signer ? `${role}: @${signer}` : `${role}: Pending`;
                }).join("\\n");

                for (const item of itemsToUpdate) {
                  await github.graphql(`
                    mutation {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: "${PROJECT_ID}"
                          itemId: "${item.id}"
                          fieldId: "${SIGNOFF_FIELD_ID}"
                          value: {
                            text: "${statusText}"
                          }
                        }
                      ) {
                        projectV2Item { id }
                      }
                    }
                  `);
                  console.log(`✅ Updated Project item #${item.content.number}`);
                }
              } else {
                console.log("⚠️ No matching items found in project");
              }
            } catch (error) {
              console.log(`❌ Project update failed: ${error.message}`);
              throw error; // Re-throw to make workflow fail visibly
            }

            // 5. Set commit status
            const allSignedOff = roles.every(role => signoffData[role]);
            
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: allSignedOff ? "success" : "pending",
              context: "pr-signoff-gatekeeper",
              description: `${checkedCount}/${roles.length} sign-offs complete`
            });

            console.log(allSignedOff ? "✅ ALL SIGN-OFFS COMPLETE" : `⏳ ${checkedCount}/${roles.length} complete`);