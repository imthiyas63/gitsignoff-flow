name: pr-signoff-gatekeeper

on:
  pull_request:
    types: [edited]

permissions:
  pull-requests: write
  contents: read
  statuses: write
  issues: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: check-signoff-status
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const author = pr.user.login;
            const sender = context.payload.sender.login;
            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];

            // 1. Self-Approval Blocker
            if (author === sender) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `### ⚠️ Self-Approval Blocked\n**@${sender}**, you cannot sign off on your own PR.`
              });
              await github.rest.repos.createCommitStatus({
                owner, repo, sha,
                state: 'failure',
                context: 'pr-signoff-gatekeeper',
                description: 'Self-approval not allowed'
              });
              core.setFailed(`PR Author cannot approve their own PR`);
              return;
            }

            // 2. Extract Issue Numbers from PR body
            const issueNumbers = new Set();
            const keywordRegex = /(?:Closes|Fixes|Resolves)\s+#(\d+)/gi;
            let match;
            while ((match = keywordRegex.exec(body)) !== null) {
              issueNumbers.add(parseInt(match[1]));
            }
            const hashRegex = /#(\d+)/g;
            while ((match = hashRegex.exec(body)) !== null) {
              const num = parseInt(match[1]);
              if (num !== prNumber) {
                issueNumbers.add(num);
              }
            }
            const relatedIssues = Array.from(issueNumbers);

            // 3. Count currently checked boxes and collect reviewers
            let checkedCount = 0;
            const reviewers = [];
            const timestamp = new Date().toISOString();

            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
                reviewers.push(`@${sender}`);
              }
            }

            // 4. Post comment on PR for audit trail
            const { data: prComments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });

            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                const alreadyRecorded = prComments.some(c => 
                  c.body.includes(`Sign-off Recorded: ${role}`) && 
                  !c.body.includes(`Revoked`)
                );
                if (!alreadyRecorded) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}`
                  });
                }
              }
            }

            // 5. UPDATE PROJECT REVIEWERS FIELD
            // Get unique reviewers
            const uniqueReviewers = [...new Set(reviewers)];
            const reviewersText = uniqueReviewers.join(', ');
            
            // Configuration - REPLACE THESE WITH YOUR ACTUAL IDs
            const PROJECT_NUMBER = 1;  // Your project number
            const REVIEWERS_FIELD_ID = 'PVTF_...';  // Replace with actual field ID from Step 1
            
            try {
              // Find the project item for this PR
              const itemQuery = `
                query($projectNumber: Int!, $prNumber: Int!) {
                  repository(owner: "${owner}", name: "${repo}") {
                    projectV2(number: $projectNumber) {
                      item(contentId: "PR_${prNumber}") {
                        id
                      }
                    }
                  }
                }
              `;
              
              const itemResult = await github.graphql(itemQuery, {
                projectNumber: PROJECT_NUMBER,
                prNumber: prNumber
              });
              
              const itemId = itemResult.repository.projectV2.item?.id;
              
              if (itemId) {
                // Update the Reviewers field
                const updateMutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: {text: $value}
                      }
                    ) {
                      clientMutationId
                    }
                  }
                `;
                
                // Get project ID
                const projectQuery = `
                  query($projectNumber: Int!) {
                    repository(owner: "${owner}", name: "${repo}") {
                      projectV2(number: $projectNumber) {
                        id
                      }
                    }
                  }
                `;
                
                const projectResult = await github.graphql(projectQuery, {
                  projectNumber: PROJECT_NUMBER
                });
                
                const projectId = projectResult.repository.projectV2.id;
                
                await github.graphql(updateMutation, {
                  projectId: projectId,
                  itemId: itemId,
                  fieldId: REVIEWERS_FIELD_ID,
                  value: reviewersText
                });
                
                core.info(`✅ Updated Project Reviewers field: ${reviewersText}`);
              } else {
                core.info('⚠️ PR not found in project. Add it to the project first.');
              }
            } catch (error) {
              core.warning(`Could not update Project field: ${error.message}`);
            }

            // 6. Update Issue description (if related issues exist)
            for (const issueNum of relatedIssues) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number: issueNum
                });

                let tableRows = "";
                for (const role of roles) {
                  const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
                  const isChecked = regex.test(body);
                  const status = isChecked ? '✅ Approved' : '⏳ Pending';
                  const signedBy = isChecked ? `@${sender}` : '-';
                  const time = isChecked ? timestamp : '-';
                  tableRows += `| **${role}** | ${status} | ${signedBy} | ${time} |\n`;
                }

                const signoffTable = `## PR Sign-off Status\n\n| Role | Status | Signed By | Timestamp |\n|------|--------|-----------|-----------|\n${tableRows}\n---\n*Last updated: ${timestamp} from PR #${prNumber}*`;

                let newBody = issue.body || "";
                const tableRegex = /## PR Sign-off Status[\s\S]*?(?=##|$)/;
                
                if (tableRegex.test(newBody)) {
                  newBody = newBody.replace(tableRegex, signoffTable);
                } else {
                  newBody = newBody + "\n\n" + signoffTable;
                }

                await github.rest.issues.update({
                  owner, repo, issue_number: issueNum,
                  body: newBody
                });
                core.info(`✅ Updated Issue #${issueNum} description`);
              } catch (error) {
                core.warning(`Could not update Issue #${issueNum}: ${error.message}`);
              }
            }

            // 7. Update status check
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'pending';
            const description = `${checkedCount}/${roles.length} sign-offs complete`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: state,
              context: 'pr-signoff-gatekeeper',
              description: description
            });

            core.info(`Status: ${state} - ${description}`);