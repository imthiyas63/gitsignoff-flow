name: PR Sign-off Gatekeeper

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: Process Sign-offs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const actor = context.actor;
            const prAuthor = pr.user.login;

            console.log("PR SIGN-OFF GATEKEEPER START");

            // Helper function to retry API calls on 500 errors
            async function getCommentsWithRetry(maxRetries = 3) {
              for (let i = 0; i < maxRetries; i++) {
                try {
                  const { data } = await github.rest.issues.listComments({
                    owner, repo, issue_number: prNumber, per_page: 100
                  });
                  return data;
                } catch (error) {
                  console.log(`⚠️ API call attempt ${i + 1} failed: ${error.message}`);
                  if (i === maxRetries - 1) throw error;
                  console.log("Retrying in 2 seconds...");
                  await new Promise(resolve => setTimeout(resolve, 2000));
                }
              }
            }

            const roles = ["Code Review", "QA Signoff", "Impact Analysis Review"];

            function escapeRegex(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            const checkedRoles = [];
            for (const role of roles) {
              const regex = new RegExp(`^\\s*-\\s*\\[[xX]\\]\\s*${escapeRegex(role)}\\s*$`, "im");
              if (regex.test(body)) {
                checkedRoles.push(role);
              }
            }

            console.log(`Checked: ${checkedRoles.length}/${roles.length}`);

            const signoffMarker = "<!-- PR-SIGNOFF-DATA -->";
            
            // Use the retry helper here
            const comments = await getCommentsWithRetry();

            let existingSignoffData = {};
            const dataComment = comments.find(c => c.body && c.body.includes(signoffMarker));

            if (dataComment) {
              try {
                const match = dataComment.body.match(/```json\s*([\s\S]*?)\s*```/);
                if (match) existingSignoffData = JSON.parse(match[1]);
              } catch (e) { 
                console.log("Could not parse previous data"); 
              }
            }

            let authorAttemptingSignoff = false;
            for (const role of roles) {
              const regex = new RegExp(`^\\s*-\\s*\\[[xX]\\]\\s*${escapeRegex(role)}\\s*$`, "im");
              if (regex.test(body)) {
                const existingSigner = existingSignoffData[role];
                if (!existingSigner || existingSigner === actor) {
                  authorAttemptingSignoff = true;
                  break;
                }
              }
            }

            if (actor === prAuthor && authorAttemptingSignoff) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `### ⚠️ Self-Approval Blocked\n**@${actor}**, you cannot sign off on your own PR.`
              });
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state: 'failure',
                context: 'pr-signoff-gatekeeper', description: 'Self-approval not allowed'
              });
              core.setFailed(`PR Author (@${actor}) cannot approve their own PR.`);
              return;
            }

            const signoffData = {};
            for (const role of roles) {
              const regex = new RegExp(`^\\s*-\\s*\\[[xX]\\]\\s*${escapeRegex(role)}\\s*$`, "im");
              if (regex.test(body)) {
                signoffData[role] = existingSignoffData[role] || actor;
              }
            }

            const { data: currentPR } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const currentRequestedReviewers = (currentPR.requested_reviewers || []).map(u => u.login);

            for (const role of roles) {
              const signer = signoffData[role];
              if (signer && signer !== prAuthor && !currentRequestedReviewers.includes(signer)) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner, repo, pull_number: prNumber, reviewers: [signer]
                  });
                  console.log(`Requested review from @${signer}`);
                } catch (error) {
                  console.log(`Could not request @${signer}: ${error.message}`);
                }
              }
            }

            const timestamp = new Date().toISOString();
            let tableRows = "";
            for (const role of roles) {
              const signer = signoffData[role];
              tableRows += signer 
                ? `| **${role}** | ✅ Approved | @${signer} |\n`
                : `| **${role}** | ⏳ Pending | - |\n`;
            }

            const signoffTable = `## PR Sign-off Status\n\n| Role | Status | Signed By |\n|------|--------|-----------|\n${tableRows}\n---\n*Last updated: ${timestamp}*`;
            const machineData = `${signoffMarker}\n\n\`\`\`json\n${JSON.stringify(signoffData, null, 2)}\n\`\`\``;
            const finalPRComment = `${machineData}\n\n${signoffTable}`;

            if (dataComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: dataComment.id, body: finalPRComment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: finalPRComment });
            }

            const issueNumbers = new Set();
            const keywordRegex = /(?:Closes|Fixes|Resolves)\s+#(\d+)/gi;
            let match;
            while ((match = keywordRegex.exec(body)) !== null) {
              issueNumbers.add(parseInt(match[1], 10));
            }

            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                let issueRows = "";
                for (const role of roles) {
                  const signer = signoffData[role];
                  issueRows += signer 
                    ? `| **${role}** | ✅ Approved | @${signer} |\n`
                    : `| **${role}** | ⏳ Pending | - |\n`;
                }
                const issueSignoffTable = `<!-- PR-SIGNOFF-DATA -->\n\n## PR Sign-off Status\n\n| Role | Status | Signed By |\n|------|--------|-----------|\n${issueRows}\n---\n*Automatically synchronized from PR #${prNumber} on ${timestamp}*`;
                
                let newIssueBody = issue.body || "";
                const issueMarkerRegex = /<!-- PR-SIGNOFF-DATA -->[\s\S]*?(?=\n## (?!PR Sign-off Status)|$)/;
                if (issueMarkerRegex.test(newIssueBody)) {
                  newIssueBody = newIssueBody.replace(issueMarkerRegex, issueSignoffTable);
                } else {
                  newIssueBody = `${newIssueBody.trim()}\n\n${issueSignoffTable}`;
                }
                
                await github.rest.issues.update({ owner, repo, issue_number: issueNumber, body: newIssueBody });
              } catch (error) {
                console.log(`Could not update Issue #${issueNumber}: ${error.message}`);
              }
            }

            const allSignedOff = roles.every(role => Boolean(signoffData[role]));
            const checkedCount = Object.keys(signoffData).length;
            
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: allSignedOff ? "success" : "pending",
              context: "pr-signoff-gatekeeper",
              description: `${checkedCount}/${roles.length} sign-offs complete`
            });

            console.log(allSignedOff ? "✅ ALL SIGN-OFFS COMPLETE" : `⏳ ${checkedCount}/${roles.length} SIGN-OFFS COMPLETE`);
