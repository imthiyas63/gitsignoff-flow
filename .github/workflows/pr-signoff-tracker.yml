name: PR Sign-off Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write  # Needed to update PR body and post comments
  contents: read
  statuses: write       # Needed to block the merge button

jobs:
  signoff-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Checkboxes and Block Self-Approval
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            
            // Identify the PR Author and the person who just edited the PR
            const author = pr.user.login;
            const sender = context.payload.sender.login;

            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];

            // 1. SELF-APPROVAL BLOCKER
            if (author === sender) {
              core.warning(`⚠️ PR Author @${author} is trying to sign off on their own PR.`);
              
              // Revert any checked boxes back to unchecked to prevent fake approvals
              let newBody = body;
              roles.forEach(role => {
                const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'gi');
                newBody = newBody.replace(regex, `- [ ] ${role}`);
              });

              // Update the PR description to uncheck the boxes
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                body: newBody
              });

              // Post a warning comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `### ⚠️ Self-Approval Blocked\n**@${sender}**, you cannot sign off on your own Pull Request.\n\nThe checkboxes have been automatically unchecked. Please ask another team member to review and check the boxes.`
              });

              // Fail the workflow to block the merge
              core.setFailed(`PR Author (@${author}) is not allowed to approve their own PR.`);
              return; // Stop the script here
            }

            // 2. VALIDATE CHECKBOXES (Only runs if a non-author edited the PR)
            let checkedCount = 0;
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
              }
            }

            // 3. POST AUDIT COMMENTS (To keep the record of who approved)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                const alreadyPosted = comments.some(c => c.body.includes(`Sign-off Recorded: ${role}`));
                if (!alreadyPosted) {
                  const timestamp = new Date().toISOString();
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}`
                  });
                }
              }
            }

            // 4. SET MERGE GATE STATUS
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'failure';
            const description = allSignedOff 
              ? `All ${roles.length} sign-offs complete ✅` 
              : `${checkedCount}/${roles.length} sign-offs complete. Waiting...`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'PR Sign-off Gatekeeper',
              description: description
            });

            core.info(`Status set to: ${state} (${description})`);