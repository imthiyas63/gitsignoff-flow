name: pr-signoff-gatekeeper

on:
  pull_request:
    types: [edited]

permissions:
  pull-requests: write
  contents: read
  statuses: write
  issues: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: Debug and Validate Sign-offs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const author = pr.user.login;
            const sender = context.payload.sender.login;
            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];

            core.info(`🔍 Processing PR #${prNumber}`);
            core.info(`📝 PR Body: ${body.substring(0, 200)}...`);

            // 1. Extract Issue Numbers
            const issueNumbers = new Set();
            const keywordRegex = /(?:Closes|Fixes|Resolves|Related to)\s+#(\d+)/gi;
            let match;
            while ((match = keywordRegex.exec(body)) !== null) {
              issueNumbers.add(parseInt(match[1]));
              core.info(`✅ Found issue reference: #${match[1]}`);
            }
            
            // Also find bare # references
            const hashRegex = /#(\d+)/g;
            while ((match = hashRegex.exec(body)) !== null) {
              const num = parseInt(match[1]);
              if (num !== prNumber && !issueNumbers.has(num)) {
                issueNumbers.add(num);
                core.info(`✅ Found issue reference: #${num}`);
              }
            }
            
            const relatedIssues = Array.from(issueNumbers);
            core.info(`📋 Total related issues: ${relatedIssues.length}`);

            // 2. Count checked boxes
            let checkedCount = 0;
            const checkedRoles = [];
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
                checkedRoles.push(role);
                core.info(`✅ Checked: ${role}`);
              }
            }
            core.info(` Total checked: ${checkedCount}/${roles.length}`);

            // 3. Post comment on PR
            const { data: prComments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });

            const timestamp = new Date().toISOString();
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                const alreadyRecorded = prComments.some(c => 
                  c.body.includes(`Sign-off Recorded: ${role}`) && 
                  !c.body.includes(`Revoked`)
                );
                if (!alreadyRecorded) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}`
                  });
                  core.info(`✅ Posted comment on PR #${prNumber} for ${role}`);
                }
              }
            }

            // 4. Post comments to related issues
            for (const issueNum of relatedIssues) {
              core.info(` Attempting to post to Issue #${issueNum}`);
              try {
                // Check if issue exists
                await github.rest.issues.get({
                  owner, repo, issue_number: issueNum
                });
                
                const { data: issueComments } = await github.rest.issues.listComments({
                  owner, repo, issue_number: issueNum, per_page: 100
                });
                
                let postedCount = 0;
                for (const role of checkedRoles) {
                  const alreadyPosted = issueComments.some(c => 
                    c.body.includes(`PR #${prNumber}`) && 
                    c.body.includes(`Role: ${role}`)
                  );
                  
                  if (!alreadyPosted) {
                    await github.rest.issues.createComment({
                      owner, repo, issue_number: issueNum,
                      body: `### 🔗 PR Sign-off Update\n**PR:** #${prNumber}\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}\n\n---\n*Automated update from PR sign-off workflow*`
                    });
                    postedCount++;
                    core.info(`✅ Posted to Issue #${issueNum}: ${role}`);
                  }
                }
                
                if (postedCount === 0) {
                  core.info(`️ No new comments needed for Issue #${issueNum}`);
                }
              } catch (error) {
                core.warning(` Could not access Issue #${issueNum}: ${error.message}`);
              }
            }

            // 5. Update Project (if configured)
            core.info(`📌 Attempting to update Project...`);
            try {
              // Find the project
              const projectsQuery = `
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    projectsV2(first: 5) {
                      nodes {
                        id
                        number
                        title
                        fields(first: 20) {
                          nodes {
                            ... on ProjectV2Field {
                              id
                              name
                            }
                            ... on ProjectV2SingleSelectField {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              
              const projectsResult = await github.graphql(projectsQuery, { owner, repo });
              const projects = projectsResult.repository.projectsV2.nodes;
              
              core.info(`📂 Found ${projects.length} projects`);
              
              for (const project of projects) {
                core.info(`🔍 Checking project: ${project.title} (#${project.number})`);
                
                const reviewersField = project.fields.nodes.find(f => 
                  f.name.toLowerCase().includes('reviewer') || 
                  f.name.toLowerCase().includes('assignee')
                );
                
                if (reviewersField) {
                  core.info(`✅ Found Reviewers field: ${reviewersField.name} (${reviewersField.id})`);
                  
                  // Find the project item for this PR
                  const itemQuery = `
                    query($projectId: ID!, $prNumber: Int!) {
                      projectV2(projectId: $projectId) {
                        item(contentId: "PR_${prNumber}") {
                          id
                        }
                      }
                    }
                  `;
                  
                  const itemResult = await github.graphql(itemQuery, {
                    projectId: project.id,
                    prNumber: prNumber
                  });
                  
                  const itemId = itemResult.projectV2.item?.id;
                  
                  if (itemId) {
                    core.info(`✅ Found project item: ${itemId}`);
                    
                    const uniqueReviewers = [...new Set(checkedRoles.map((_, i) => `@${sender}`))];
                    const reviewersText = uniqueReviewers.join(', ') || 'Pending sign-offs';
                    
                    const updateMutation = `
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                        updateProjectV2ItemFieldValue(
                          input: {
                            projectId: $projectId
                            itemId: $itemId
                            fieldId: $fieldId
                            value: { text: $value }
                          }
                        ) {
                          clientMutationId
                        }
                      }
                    `;
                    
                    await github.graphql(updateMutation, {
                      projectId: project.id,
                      itemId: itemId,
                      fieldId: reviewersField.id,
                      value: reviewersText
                    });
                    
                    core.info(`✅ Updated Project #${project.number} Reviewers field: ${reviewersText}`);
                  } else {
                    core.warning(`️ PR #${prNumber} not found in Project #${project.number}. Add it manually first.`);
                  }
                } else {
                  core.info(`ℹ️ No Reviewers field found in project ${project.title}`);
                  core.info(`   Available fields: ${project.fields.nodes.map(f => f.name).join(', ')}`);
                }
              }
            } catch (error) {
              core.warning(` Project update failed: ${error.message}`);
            }

            // 6. Update status check
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'pending';
            const description = `${checkedCount}/${roles.length} sign-offs complete`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: state,
              context: 'pr-signoff-gatekeeper',
              description: description
            });

            core.info(`✅ Status set: ${state} - ${description}`);