name: pr-signoff-gatekeeper

on:
  pull_request:
    types: [edited]

permissions:
  pull-requests: write
  contents: read
  statuses: write
  issues: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: check-signoff-status
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const author = pr.user.login;
            const sender = context.payload.sender.login;
            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];

            // 1. Self-Approval Blocker
            if (author === sender) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `### ⚠️ Self-Approval Blocked\n**@${sender}**, you cannot sign off on your own PR.`
              });
              await github.rest.repos.createCommitStatus({
                owner, repo, sha,
                state: 'failure',
                context: 'pr-signoff-gatekeeper',
                description: 'Self-approval not allowed'
              });
              core.setFailed(`PR Author cannot approve their own PR`);
              return;
            }

            // 2. Extract Issue Numbers from PR body
            const issueNumbers = new Set();
            const keywordRegex = /(?:Closes|Fixes|Resolves)\s+#(\d+)/gi;
            let match;
            while ((match = keywordRegex.exec(body)) !== null) {
              issueNumbers.add(parseInt(match[1]));
            }
            const hashRegex = /#(\d+)/g;
            while ((match = hashRegex.exec(body)) !== null) {
              const num = parseInt(match[1]);
              if (num !== prNumber) {
                issueNumbers.add(num);
              }
            }
            const relatedIssues = Array.from(issueNumbers);

            // 3. Count currently checked boxes and track who signed
            let checkedCount = 0;
            const signoffData = {};
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
                signoffData[role] = {
                  signed: true,
                  by: sender,
                  at: new Date().toISOString()
                };
              } else {
                signoffData[role] = { signed: false, by: null, at: null };
              }
            }

            // 4. Post comment on PR (for PR audit trail)
            const { data: prComments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });

            const timestamp = new Date().toISOString();
            for (const role of roles) {
              if (signoffData[role].signed) {
                const alreadyRecorded = prComments.some(c => 
                  c.body.includes(`Sign-off Recorded: ${role}`) && 
                  !c.body.includes(`Revoked`)
                );
                
                if (!alreadyRecorded) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}`
                  });
                }
              }
            }

            // 5. UPDATE ISSUE DESCRIPTION (Text Field)
            for (const issueNum of relatedIssues) {
              try {
                // Get current issue
                const { data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number: issueNum
                });

                // Build the markdown table safely
                const tableRows = Object.entries(signoffData).map(([role, data]) => {
                  const status = data.signed ? '✅ Approved' : '⏳ Pending';
                  const signedBy = data.signed ? `@${data.by}` : '-';
                  const time = data.signed ? data.at : '-';
                  return `| **${role}** | ${status} | ${signedBy} | ${time} |`;
                }).join('\n');

                const signoffTable = [
                  '## PR Sign-off Status',
                  '',
                  '| Role | Status | Signed By | Timestamp |',
                  '|------|--------|-----------|-----------|',
                  tableRows,
                  '',
                  '---',
                  `*Last updated: ${new Date().toISOString()} from PR #${prNumber}*`
                ].join('\n');

                // Update issue body - replace existing table or append
                let newBody = issue.body || '';
                if (newBody.includes('## PR Sign-off Status')) {
                  newBody = newBody.replace(/## PR Sign-off Status[\s\S]*?(?=##|$)/, signoffTable);
                } else {
                  newBody = newBody + '\n\n' + signoffTable;
                }

                await github.rest.issues.update({
                  owner, repo, issue_number: issueNum,
                  body: newBody
                });

                core.info(`Updated Issue #${issueNum} description with sign-off table`);
              } catch (error) {
                core.warning(`Could not update Issue #${issueNum}: ${error.message}`);
              }
            }

            // 6. Update status check
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'pending';
            const description = `${checkedCount}/${roles.length} sign-offs complete`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: state,
              context: 'pr-signoff-gatekeeper',
              description: description
            });

            core.info(`Status: ${state} - ${description}`);