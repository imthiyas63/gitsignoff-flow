name: PR Sign-off Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read
  statuses: write  # ⚠️ CRITICAL: This allows the workflow to block the merge button

jobs:
  signoff-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Checkboxes and Block Merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";

            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];
            let checkedCount = 0;

            // 1. Count how many boxes are checked
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
              }
            }

            // 2. Post comments (to keep the audit trail)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                const alreadyPosted = comments.some(c => c.body.includes(`Sign-off Recorded: ${role}`));
                if (!alreadyPosted) {
                  const timestamp = new Date().toISOString();
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${context.payload.sender.login}\n**Timestamp:** ${timestamp}`
                  });
                }
              }
            }

            // 3. THE MAGIC: Set the Commit Status to block the merge
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'failure';
            const description = allSignedOff 
              ? `All ${roles.length} sign-offs complete ✅` 
              : `${checkedCount}/${roles.length} sign-offs complete. Waiting...`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'PR Sign-off Gatekeeper', // This is the name we will use in Branch Protection
              description: description
            });

            core.info(`Status set to: ${state} (${description})`);