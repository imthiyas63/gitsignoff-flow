name: PR Sign-off Gatekeeper

on:
  pull_request:
    types: [edited, opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  statuses: write
  issues: write

jobs:
  validate-signoff:
    name: Validate Sign-off Checkboxes
    runs-on: ubuntu-latest
    steps:
      - name: Discover Project Configuration
        id: discover
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Query to find projects dynamically
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 10) {
                    nodes {
                      id
                      number
                      title
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            dataType
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const result = await github.graphql(query, { owner, repo });
            const projects = result.repository.projectsV2.nodes;
            
            let projectId = '';
            let reviewersFieldId = '';
            
            for (const project of projects) {
              const reviewersField = project.fields.nodes.find(f => 
                f.name.toLowerCase().includes('reviewer') || 
                f.name.toLowerCase().includes('assignee')
              );
              
              if (reviewersField) {
                projectId = project.id;
                reviewersFieldId = reviewersField.id;
                console.log(`✅ Using Project #${project.number}: "${project.title}"`);
                break;
              }
            }
            
            core.setOutput('project_id', projectId);
            core.setOutput('reviewers_field_id', reviewersFieldId);

      - name: Check sign-off status and update Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const sha = pr.head.sha;
            const body = pr.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const author = pr.user.login;
            const sender = context.payload.sender.login;
            const roles = ['Code Review', 'QA Signoff', 'Impact Analysis Review'];
            
            // Get project IDs from previous step
            const projectId = '${{ steps.discover.outputs.project_id }}';
            const reviewersFieldId = '${{ steps.discover.outputs.reviewers_field_id }}';
            
            console.log(` Processing PR #${prNumber} edited by @${sender}`);
            
            // 1. Self-Approval Blocker
            if (author === sender) {
              console.log(`⚠️ Self-approval detected!`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `### ⚠️ Self-Approval Blocked\n**@${sender}**, you cannot sign off on your own PR.`
              });
              await github.rest.repos.createCommitStatus({
                owner, repo, sha,
                state: 'failure',
                context: 'pr-signoff-gatekeeper',
                description: 'Self-approval not allowed'
              });
              core.setFailed(`PR Author cannot approve their own PR`);
              return;
            }
            
            // 2. Extract Issue Numbers from PR body
            const issueNumbers = new Set();
            const keywordRegex = /(?:Closes|Fixes|Resolves)\s+#(\d+)/gi;
            let match;
            while ((match = keywordRegex.exec(body)) !== null) {
              issueNumbers.add(parseInt(match[1]));
            }
            
            // Also find bare # references
            const hashRegex = /#(\d+)/g;
            while ((match = hashRegex.exec(body)) !== null) {
              const num = parseInt(match[1]);
              if (num !== prNumber) {
                issueNumbers.add(num);
              }
            }
            
            const relatedIssues = Array.from(issueNumbers);
            console.log(`📋 Related issues: #${relatedIssues.join(', #')}`);
            
            // 3. Count checked boxes
            let checkedCount = 0;
            const checkedRoles = [];
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                checkedCount++;
                checkedRoles.push(role);
                console.log(`✅ Checked: ${role}`);
              }
            }
            console.log(`📊 Total checked: ${checkedCount}/${roles.length}`);
            
            // 4. Post comment on PR
            const { data: prComments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });
            
            const timestamp = new Date().toISOString();
            for (const role of roles) {
              const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
              if (regex.test(body)) {
                const alreadyRecorded = prComments.some(c => 
                  c.body.includes(`Sign-off Recorded: ${role}`) && 
                  !c.body.includes(`Revoked`)
                );
                if (!alreadyRecorded) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber,
                    body: `### ✅ Sign-off Recorded\n**Role:** ${role}\n**Signed by:** @${sender}\n**Timestamp:** ${timestamp}`
                  });
                  console.log(`✅ Posted comment on PR #${prNumber} for ${role}`);
                }
              }
            }
            
            // 5. UPDATE PROJECT REVIEWERS FIELD (if project found)
            if (projectId && reviewersFieldId) {
              console.log(`📌 Attempting to update Project Reviewers field...`);
              
              try {
                // Find the project item for this PR
                const itemQuery = `
                  query($projectId: ID!, $prNumber: Int!) {
                    projectV2(projectId: $projectId) {
                      item(contentId: "PR_${prNumber}") {
                        id
                      }
                    }
                  }
                `;
                
                const itemResult = await github.graphql(itemQuery, {
                  projectId,
                  prNumber
                });
                
                const itemId = itemResult.projectV2.item?.id;
                
                if (!itemId) {
                  console.log(`   ⚠️ PR #${prNumber} is NOT in Project. Add it manually first!`);
                } else {
                  console.log(`   ✅ Found project item: ${itemId}`);
                  
                  // Build reviewers text
                  const uniqueReviewers = [...new Set(checkedRoles.map(() => `@${sender}`))];
                  const reviewersText = uniqueReviewers.length > 0 
                    ? uniqueReviewers.join(', ') 
                    : 'Pending sign-offs';
                  
                  console.log(`   📝 Setting Reviewers to: "${reviewersText}"`);
                  
                  // Update the field using GraphQL mutation
                  const updateMutation = `
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { text: $value }
                        }
                      ) {
                        clientMutationId
                      }
                    }
                  `;
                  
                  await github.graphql(updateMutation, {
                    projectId,
                    itemId,
                    fieldId: reviewersFieldId,
                    value: reviewersText
                  });
                  
                  console.log(`   ✅ Successfully updated Project Reviewers field!`);
                }
              } catch (error) {
                console.error(`❌ Project update failed: ${error.message}`);
              }
            } else {
              console.log(`⚠️ No project configuration found. Skipping Project update.`);
            }
            
            // 6. Update Issue descriptions
            for (const issueNum of relatedIssues) {
              try {
                console.log(`📝 Attempting to update Issue #${issueNum}...`);
                const { data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number: issueNum
                });
                
                let tableRows = "";
                for (const role of roles) {
                  const regex = new RegExp(`- \\[[xX]\\]\\s+${role}`, 'i');
                  const isChecked = regex.test(body);
                  const status = isChecked ? '✅ Approved' : '⏳ Pending';
                  const signedBy = isChecked ? `@${sender}` : '-';
                  const time = isChecked ? timestamp : '-';
                  tableRows += `| **${role}** | ${status} | ${signedBy} | ${time} |\n`;
                }
                
                const signoffTable = `## PR Sign-off Status\n\n| Role | Status | Signed By | Timestamp |\n|------|--------|-----------|-----------|\n${tableRows}\n---\n*Last updated: ${timestamp} from PR #${prNumber}*`;
                
                let newBody = issue.body || "";
                const tableRegex = /## PR Sign-off Status[\s\S]*?(?=##|$)/;
                
                if (tableRegex.test(newBody)) {
                  newBody = newBody.replace(tableRegex, signoffTable);
                } else {
                  newBody = newBody + "\n\n" + signoffTable;
                }
                
                await github.rest.issues.update({
                  owner, repo, issue_number: issueNum,
                  body: newBody
                });
                
                console.log(`✅ Updated Issue #${issueNum}`);
              } catch (error) {
                console.warn(`⚠️ Could not update Issue #${issueNum}: ${error.message}`);
              }
            }
            
            // 7. Update status check
            const allSignedOff = checkedCount === roles.length;
            const state = allSignedOff ? 'success' : 'pending';
            const description = `${checkedCount}/${roles.length} sign-offs complete`;
            
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: state,
              context: 'pr-signoff-gatekeeper',
              description: description
            });
            
            console.log(`✅ Status: ${state} - ${description}`);