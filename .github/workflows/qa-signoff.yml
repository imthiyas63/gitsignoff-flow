name: Update QA Sign-off Field

# Fires when the PR description is edited, e.g. when someone checks the
# "QA Signoff" checkbox in the sign-off checklist template.
on:
  pull_request:
    types: [edited]

# NOTE: There is no valid `projects` permission key for GITHUB_TOKEN.
# Projects V2 (the new org-level Projects board) cannot be granted write
# access via the `permissions:` block at all -- GITHUB_TOKEN simply has no
# scope for it. `repository-projects` only covers classic (v1) projects.
#
# You must create a Personal Access Token with Projects V2 write access
# (classic PAT with the `project` scope, or a fine-grained PAT with
# organization "Projects: Read and write" permission), then save it as a
# repo secret, e.g. PROJECTS_PAT. Use that secret as the github-script
# `github-token` input below -- do not use secrets.GITHUB_TOKEN for the
# GraphQL calls, it will 403 no matter what you put in `permissions:`.
permissions:
  contents: read
  pull-requests: write

jobs:
  update-qa-field:
    runs-on: ubuntu-latest
    steps:
      - name: Update QA Sign-off in Project
        uses: actions/github-script@v7
        with:
          # Requires a PAT with Projects V2 write access, see note above.
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const actor = context.actor;
            const body = context.payload.pull_request.body || '';

            // Hardcoded Project and Field IDs from your GraphQL output
            const PROJECT_ID = "PVT_kwHODDf9DM4BjCjd";
            const QA_FIELD_ID = "PVTF_lAHODDf9DM4BjCjdzhh4gjY";

            // The PR description contains a markdown checklist, e.g.:
            //   - [x] QA Signoff
            // We detect whether that specific item is checked. context.actor
            // is whoever last edited the PR body (i.e. whoever ticked the box).
            const qaCheckboxRegex = /-\s*\[([xX])\]\s*QA\s*Signoff/;
            const match = body.match(qaCheckboxRegex);
            const isQaApproved = !!match;
            const qaValue = isQaApproved ? `Approved by @${actor}` : 'Pending QA Review';

            console.log(`PR #${prNumber}`);
            console.log(`QA Signoff checkbox checked: ${isQaApproved}`);
            console.log(`QA Status: ${qaValue}`);

            try {
              // Find the ProjectV2 item that corresponds to this PR.
              // Projects V2 has no server-side filter by content number, so we
              // page through all items and match client-side. $prNumber must
              // NOT be declared in the query signature since it's never used
              // inside the query body itself (GraphQL rejects unused variables).
              const itemQuery = `
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          id
                          content {
                            ... on PullRequest {
                              number
                            }
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              let itemId = null;
              let cursor = null;
              let hasNextPage = true;

              while (hasNextPage && !itemId) {
                const result = await github.graphql(itemQuery, {
                  projectId: PROJECT_ID,
                  cursor: cursor
                });

                const itemsConnection = result.node.items;
                const match = itemsConnection.nodes.find(
                  item => item.content && item.content.number === prNumber
                );

                if (match) {
                  itemId = match.id;
                  break;
                }

                hasNextPage = itemsConnection.pageInfo.hasNextPage;
                cursor = itemsConnection.pageInfo.endCursor;
              }

              if (!itemId) {
                console.log(`PR #${prNumber} is not in the project. Add it manually first.`);
                return;
              }

              console.log(`Found project item ID: ${itemId}`);

              // Update the QA Sign-off text field
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { text: $value }
                  }) {
                    clientMutationId
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: PROJECT_ID,
                itemId: itemId,
                fieldId: QA_FIELD_ID,
                value: qaValue
              });

              console.log(`Successfully updated "QA Sign-off" field to: "${qaValue}"`);
            } catch (error) {
              console.error(`Failed to update QA field: ${error.message}`);
              core.setFailed(error.message);
            }
