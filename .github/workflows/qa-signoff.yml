name: Update QA Sign-off Field

on:
  pull_request:
    types: [edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  update-qa-field:
    runs-on: ubuntu-latest
    steps:
      - name: Update QA Sign-off in Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const actor = context.actor;
            const body = context.payload.pull_request.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Hardcoded Project and Field IDs
            const PROJECT_ID = "PVT_kwHODDf9DM4BjCjd";
            const QA_FIELD_ID = "PVTF_lAHODDf9DM4BjCjdzhh4gjY";

            // Check if "QA Signoff" checkbox is checked
            const qaCheckboxRegex = /- \[[xX]\]\s*QA Signoff/i;
            const isQaApproved = qaCheckboxRegex.test(body);
            const qaValue = isQaApproved ? `Approved by @${actor}` : 'Pending QA Review';

            console.log(`PR #${prNumber}`);
            console.log(`QA Checkbox: ${isQaApproved ? 'Checked ✅' : 'Unchecked ☐'}`);
            console.log(`QA Status: ${qaValue}`);

            try {
              // Step 1: Find linked issue numbers from PR body
              const issueNumbers = [];
              const keywordRegex = /(?:Closes|Fixes|Resolves)\s+#(\d+)/gi;
              let match;
              while ((match = keywordRegex.exec(body)) !== null) {
                issueNumbers.push(parseInt(match[1], 10));
              }
              
              // Also check for bare # references
              const hashRegex = /#(\d+)/g;
              while ((match = hashRegex.exec(body)) !== null) {
                const num = parseInt(match[1], 10);
                if (num !== prNumber && !issueNumbers.includes(num)) {
                  issueNumbers.push(num);
                }
              }

              console.log(`Found linked issue numbers: ${issueNumbers.join(', ') || 'none'}`);

              if (issueNumbers.length === 0) {
                console.log(`⚠️ No linked issues found in PR #${prNumber} description.`);
                console.log(` Add "Closes #XX" or "#XX" to the PR description.`);
                return;
              }

              // Step 2: Find which of these issues is in the project
              let itemId = null;
              let foundIssueNumber = null;

              const itemQuery = `
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          id
                          content {
                            ... on Issue {
                              number
                            }
                            ... on PullRequest {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              let cursor = null;
              let hasNextPage = true;

              while (hasNextPage && !itemId) {
                const result = await github.graphql(itemQuery, {
                  projectId: PROJECT_ID,
                  cursor: cursor
                });

                const itemsConnection = result.node.items;
                
                for (const item of itemsConnection.nodes) {
                  if (item.content && item.content.__typename === 'Issue') {
                    if (issueNumbers.includes(item.content.number)) {
                      itemId = item.id;
                      foundIssueNumber = item.content.number;
                      break;
                    }
                  }
                }

                if (!itemId) {
                  hasNextPage = itemsConnection.pageInfo.hasNextPage;
                  cursor = itemsConnection.pageInfo.endCursor;
                }
              }

              if (!itemId) {
                console.log(`⚠️ None of the linked issues (${issueNumbers.join(', ')}) are in the project.`);
                console.log(`👉 Add one of these issues to the "Testing" project board.`);
                return;
              }

              console.log(`✅ Found Issue #${foundIssueNumber} in project. Item ID: ${itemId}`);

              // Step 3: Update the QA Sign-off field
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { text: $value }
                  }) {
                    clientMutationId
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: PROJECT_ID,
                itemId: itemId,
                fieldId: QA_FIELD_ID,
                value: qaValue
              });

              console.log(`🎉 Successfully updated Issue #${foundIssueNumber} "QA Sign-off" field to: "${qaValue}"`);
            } catch (error) {
              console.error(`❌ Failed to update QA field: ${error.message}`);
              core.setFailed(error.message);
            }