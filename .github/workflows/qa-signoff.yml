name: Update QA Sign-off Field

on:
  pull_request:
    types: [labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-qa-field:
    runs-on: ubuntu-latest
    steps:
      - name: Update QA Sign-off in Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const actor = context.actor;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            
            // Your exact Project and Field IDs from your GraphQL output
            const PROJECT_ID = "PVT_kwHODDf9DM4BjCjd";  
            const QA_FIELD_ID = "PVTF_lAHODDf9DM4BjCjdzhh4gjY";  
            
            const isQaApproved = labels.includes('qa-approved') || labels.includes('QA Signoff');
            const qaValue = isQaApproved ? `Approved by @${actor}` : 'Pending QA Review';
            
            console.log(`PR #${prNumber}`);
            console.log(`Labels: ${labels.join(', ')}`);
            console.log(`QA Status: ${qaValue}`);
            
            try {
              // CORRECT QUERY: Fetch items and find the one matching the PR number
              const itemQuery = `
                query($projectId: ID!, $prNumber: Int!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on PullRequest {
                              number
                            }
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              
              const itemResult = await github.graphql(itemQuery, {
                projectId: PROJECT_ID,
                prNumber: prNumber
              });
              
              // Filter the items to find the one that matches our PR number
              const projectItems = itemResult.node.items.nodes;
              const projectItem = projectItems.find(item => 
                item.content && item.content.number === prNumber
              );
              
              const itemId = projectItem ? projectItem.id : null;
              
              if (!itemId) {
                console.log(`⚠️ PR #${prNumber} is not in the project. Please add it manually first.`);
                return;
              }
              
              console.log(`✅ Found project item ID: ${itemId}`);
              
              // Update the QA Sign-off field
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { text: $value }
                    }
                  ) {
                    clientMutationId
                  }
                }
              `;
              
              await github.graphql(mutation, {
                projectId: PROJECT_ID,
                itemId: itemId,
                fieldId: QA_FIELD_ID,
                value: qaValue
              });
              
              console.log(`✅ Successfully updated "QA Sign-off" field to: "${qaValue}"`);
              
            } catch (error) {
              console.error(`❌ Failed to update QA field: ${error.message}`);
              core.setFailed(error.message);
            }