name: Update QA Sign-off Field

# Fires when the PR description is edited, e.g. when someone checks the
# "QA Signoff" checkbox in the sign-off checklist template.
on:
  pull_request:
    types: [edited]

# NOTE: There is no valid `projects` permission key for GITHUB_TOKEN.
# Projects V2 (the new org-level Projects board) cannot be granted write
# access via the `permissions:` block at all -- GITHUB_TOKEN simply has no
# scope for it. `repository-projects` only covers classic (v1) projects.
#
# You must create a Personal Access Token with Projects V2 write access
# (classic PAT with the `project` scope, or a fine-grained PAT with
# organization "Projects: Read and write" permission), then save it as a
# repo secret, e.g. PROJECTS_PAT. Use that secret as the github-script
# `github-token` input below -- do not use secrets.GITHUB_TOKEN for the
# GraphQL calls, it will 403 no matter what you put in `permissions:`.
permissions:
  contents: read
  pull-requests: write

jobs:
  update-qa-field:
    runs-on: ubuntu-latest
    steps:
      - name: Update QA Sign-off in Project
        uses: actions/github-script@v7
        env:
          # No project/field IDs hardcoded here -- this workflow can be copied
          # into any repo unchanged. Instead, set these repository variables
          # per repo (Settings > Secrets and variables > Actions > Variables):
          #   PROJECT_TITLES -- comma-separated list of Projects V2 board
          #                     titles linked to this repo, e.g.
          #                     "Testing,Featureplan,Imapact team"
          #                     The QA field is updated on every board in
          #                     this list that the linked issue is (or gets
          #                     added to).
          #   QA_FIELD_NAME  -- exact name of the custom text field
          #                     (defaults to "QA Sign-off" if not set)
          # Each project must be linked to the repo (repo's "Projects" tab)
          # for the lookup below to find it.
          PROJECT_TITLES: ${{ vars.PROJECT_TITLES }}
          QA_FIELD_NAME: ${{ vars.QA_FIELD_NAME }}
        with:
          # Requires a PAT with Projects V2 write access, see note above.
          github-token: ${{ secrets.PROJECTS_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const actor = context.actor;
            const body = context.payload.pull_request.body || '';

            const projectTitlesRaw = process.env.PROJECT_TITLES;
            const qaFieldName = process.env.QA_FIELD_NAME || 'QA Sign-off';

            if (!projectTitlesRaw) {
              core.setFailed('Repository variable PROJECT_TITLES is not set. Add it under Settings > Secrets and variables > Actions > Variables (comma-separated project titles).');
              return;
            }

            const projectTitles = projectTitlesRaw.split(',').map(t => t.trim()).filter(Boolean);

            // Resolve each project's ID by title and its QA field ID by name
            // at runtime, instead of hardcoding IDs. This makes the workflow
            // portable across repos/projects -- copy the file as-is and just
            // set PROJECT_TITLES (and optionally QA_FIELD_NAME) per repo.
            const projectLookupQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 20) {
                    nodes {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2FieldCommon {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectLookupResult = await github.graphql(projectLookupQuery, {
              owner: owner,
              repo: repo
            });

            const allProjects = projectLookupResult.repository.projectsV2.nodes;

            // Resolve each requested title to { PROJECT_ID, QA_FIELD_ID }.
            // Titles that don't match, or whose board lacks the QA field,
            // are logged and skipped rather than failing the whole run --
            // one misconfigured board shouldn't block updates on the rest.
            const resolvedProjects = [];
            for (const title of projectTitles) {
              const project = allProjects.find(p => p.title === title);

              if (!project) {
                const available = allProjects.map(p => p.title).join(', ') || '(none)';
                console.log(`Skipping "${title}": no project with that title is linked to ${owner}/${repo}. Linked projects: ${available}.`);
                continue;
              }

              const field = project.fields.nodes.find(f => f && f.name === qaFieldName);

              if (!field) {
                const available = project.fields.nodes.filter(Boolean).map(f => f.name).join(', ') || '(none)';
                console.log(`Skipping "${title}": no field named "${qaFieldName}" found. Available fields: ${available}.`);
                continue;
              }

              resolvedProjects.push({ title, projectId: project.id, fieldId: field.id });
              console.log(`Resolved project "${title}" -> ${project.id}, field "${qaFieldName}" -> ${field.id}`);
            }

            if (resolvedProjects.length === 0) {
              core.setFailed(`None of the configured PROJECT_TITLES (${projectTitles.join(', ')}) could be resolved with field "${qaFieldName}". See log above for details.`);
              return;
            }

            // The PR description contains a markdown checklist, e.g.:
            //   - [x] QA Signoff
            // We detect whether that specific item is checked. context.actor
            // is whoever last edited the PR body (i.e. whoever ticked the box).
            const qaCheckboxRegex = /-\s*\[([xX])\]\s*QA\s*Signoff/;
            const isQaApproved = qaCheckboxRegex.test(body);
            const qaValue = isQaApproved ? `Approved by @${actor}` : 'Pending QA Review';

            console.log(`PR #${prNumber}`);
            console.log(`QA Signoff checkbox checked: ${isQaApproved}`);
            console.log(`QA Status: ${qaValue}`);

            // Find issues linked to this PR. This covers BOTH:
            //  - closing keywords in the PR body (Closes/Fixes/Resolves #N)
            //  - issues linked manually via the "Development" sidebar on the
            //    PR or issue (which is how imthiyas63/gitsignoff-flow#33 was
            //    linked -- no keyword in the body at all).
            // closingIssuesReferences reflects both cases.
            const linkedIssuesQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `;

            const linkedIssuesResult = await github.graphql(linkedIssuesQuery, {
              owner: owner,
              repo: repo,
              number: prNumber
            });

            const linkedIssues = linkedIssuesResult.repository.pullRequest.closingIssuesReferences.nodes;

            if (linkedIssues.length === 0) {
              console.log('No linked issue found (no closing keyword and no Development link). Skipping project update.');
              return;
            }

            console.log(`Linked issue(s): ${linkedIssues.map(i => i.number).join(', ')}`);

            // Finds the ProjectV2 item id for a given content number (issue or PR)
            // within a specific project. Projects V2 has no server-side filter
            // by content number, so we page through all items and match
            // client-side.
            async function findProjectItemByNumber(projectId, number) {
              const itemQuery = `
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          id
                          content {
                            ... on PullRequest {
                              number
                            }
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              let cursor = null;
              let hasNextPage = true;

              while (hasNextPage) {
                const result = await github.graphql(itemQuery, {
                  projectId: projectId,
                  cursor: cursor
                });

                const itemsConnection = result.node.items;
                const match = itemsConnection.nodes.find(
                  item => item.content && item.content.number === number
                );

                if (match) {
                  return match.id;
                }

                hasNextPage = itemsConnection.pageInfo.hasNextPage;
                cursor = itemsConnection.pageInfo.endCursor;
              }

              return null;
            }

            async function updateQaField(projectId, fieldId, itemId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { text: $value }
                  }) {
                    clientMutationId
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: projectId,
                itemId: itemId,
                fieldId: fieldId,
                value: qaValue
              });
            }

            try {
              for (const { title, projectId, fieldId } of resolvedProjects) {
                for (const issue of linkedIssues) {
                  const issueNumber = issue.number;
                  const issueNodeId = issue.id;

                  let itemId = await findProjectItemByNumber(projectId, issueNumber);

                  if (!itemId) {
                    console.log(`[${title}] Issue #${issueNumber} is not in the project yet. Adding it now.`);
                    const addMutation = `
                      mutation($projectId: ID!, $contentId: ID!) {
                        addProjectV2ItemById(input: {
                          projectId: $projectId
                          contentId: $contentId
                        }) {
                          item {
                            id
                          }
                        }
                      }
                    `;

                    const addResult = await github.graphql(addMutation, {
                      projectId: projectId,
                      contentId: issueNodeId
                    });

                    itemId = addResult.addProjectV2ItemById.item.id;
                    console.log(`[${title}] Added issue #${issueNumber} to the project.`);
                  }

                  await updateQaField(projectId, fieldId, itemId);
                  console.log(`[${title}] Updated "${qaFieldName}" field on issue #${issueNumber} to: "${qaValue}"`);
                }
              }
            } catch (error) {
              console.error(`Failed to update QA field: ${error.message}`);
              core.setFailed(error.message);
            }
