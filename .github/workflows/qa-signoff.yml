name: Update QA Sign-off Field

on:
  pull_request:
    types: [labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write
  # 'projects: write' removed to bypass YAML validator error. 
  # The token inherits write access from your Repository Settings.

jobs:
  update-qa-field:
    runs-on: ubuntu-latest
    steps:
      - name: Update QA Sign-off in Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const actor = context.actor;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            
            // Your exact Project and Field IDs from your GraphQL output
            const PROJECT_ID = "PVT_kwHODDf9DM4BjCjd";  
            const QA_FIELD_ID = "PVTF_lAHODDf9DM4BjCjdzhh4gjY";  
            
            // Determine the value based on labels
            const isQaApproved = labels.includes('qa-approved') || labels.includes('QA Signoff');
            const qaValue = isQaApproved ? `Approved by @${actor}` : 'Pending QA Review';
            
            console.log(`PR #${prNumber}`);
            console.log(`Labels: ${labels.join(', ')}`);
            console.log(`QA Status: ${qaValue}`);
            
            try {
              // 1. Find the project item for this PR
              const itemQuery = `
                query($projectId: ID!, $prNumber: Int!) {
                  projectV2(projectId: $projectId) {
                    item(contentId: "PR_${prNumber}") {
                      id
                    }
                  }
                }
              `;
              
              const itemResult = await github.graphql(itemQuery, {
                projectId: PROJECT_ID,
                prNumber: prNumber
              });
              
              const itemId = itemResult.projectV2.item?.id;
              
              if (!itemId) {
                console.log(`⚠️ PR #${prNumber} is not in the project. Add it manually first.`);
                return;
              }
              
              console.log(`✅ Found project item: ${itemId}`);
              
              // 2. Update the QA Sign-off field
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { text: $value }
                    }
                  ) {
                    clientMutationId
                  }
                }
              `;
              
              await github.graphql(mutation, {
                projectId: PROJECT_ID,
                itemId: itemId,
                fieldId: QA_FIELD_ID,
                value: qaValue
              });
              
              console.log(`✅ Successfully updated "QA Sign-off" field to: "${qaValue}"`);
              
            } catch (error) {
              console.error(`❌ Failed to update QA field: ${error.message}`);
              core.setFailed(error.message);
            }