name: Discover Project IDs

on:
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.get-ids.outputs.project_id }}
      reviewers_field_id: ${{ steps.get-ids.outputs.reviewers_field_id }}
    steps:
      - name: Get Project and Field IDs
        id: get-ids
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Query to find projects and their fields
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 10) {
                    nodes {
                      id
                      number
                      title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            dataType
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            try {
              const result = await github.graphql(query, { owner, repo });
              const projects = result.repository.projectsV2.nodes;
              
              core.info(`Found ${projects.length} projects`);
              
              for (const project of projects) {
                core.info(`\n📋 Project #${project.number}: "${project.title}"`);
                core.info(`Project ID: ${project.id}`);
                
                // Find "Reviewers" field
                const reviewersField = project.fields.nodes.find(f => 
                  f.name.toLowerCase() === 'reviewers' || 
                  f.name.toLowerCase() === 'reviewer'
                );
                
                if (reviewersField) {
                  core.info(`✅ Reviewers Field ID: ${reviewersField.id}`);
                  core.info(`   Field Name: ${reviewersField.name}`);
                  core.info(`   Data Type: ${reviewersField.dataType}`);
                  
                  // Output for use in other steps
                  core.setOutput('project_id', project.id);
                  core.setOutput('reviewers_field_id', reviewersField.id);
                } else {
                  core.info(`️ No "Reviewers" field found in this project`);
                  core.info(`   Available fields:`);
                  project.fields.nodes.forEach(field => {
                    core.info(`     - ${field.name} (${field.id})`);
                  });
                }
              }
            } catch (error) {
              core.setFailed(`Error discovering project IDs: ${error.message}`);
            }