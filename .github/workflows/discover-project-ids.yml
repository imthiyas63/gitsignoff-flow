name: Discover Project IDs

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.get-ids.outputs.project_id }}
      reviewers_field_id: ${{ steps.get-ids.outputs.reviewers_field_id }}
    steps:
      - name: Get Project and Field IDs
        id: get-ids
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`🔍 Searching for projects in ${owner}/${repo}...`);
            
            // Query to find projects and their fields
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 10) {
                    nodes {
                      id
                      number
                      title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            dataType
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const result = await github.graphql(query, { owner, repo });
            const projects = result.repository.projectsV2.nodes;
            
            console.log(`✅ Found ${projects.length} projects`);
            
            for (const project of projects) {
              console.log(`\n Project #${project.number}: "${project.title}"`);
              console.log(`   Project ID: ${project.id}`);
              
              // Find "Reviewers" field (case-insensitive)
              const reviewersField = project.fields.nodes.find(f => 
                f.name.toLowerCase().includes('reviewer') || 
                f.name.toLowerCase().includes('assignee')
              );
              
              if (reviewersField) {
                console.log(`   ✅ Found Reviewers field!`);
                console.log(`      Field Name: ${reviewersField.name}`);
                console.log(`      Field ID: ${reviewersField.id}`);
                console.log(`      Data Type: ${reviewersField.dataType}`);
                
                // Output for use in other steps
                core.setOutput('project_id', project.id);
                core.setOutput('reviewers_field_id', reviewersField.id);
                core.setOutput('project_number', project.number);
              } else {
                console.log(`   ⚠️ No "Reviewers" field found in this project`);
                console.log(`   Available fields:`);
                project.fields.nodes.forEach(field => {
                  console.log(`     - ${field.name} (${field.id}) [${field.dataType}]`);
                });
              }
            }
            
            if (projects.length === 0) {
              core.setFailed('No projects found in this repository');
            }